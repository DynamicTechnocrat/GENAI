[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "deji-tools"
version = "0.1.0"
description = "A collection of useful Python tools created by Deji"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    {name = "Ayodeji Michael"}
]

[tool.setuptools.packages.find]
where = ["src"]
